name: Compile RetroArch Web Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装宿主机基础依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git webp python3

      # 2. 部署并激活 Emscripten SDK
      - name: Setup Emscripten SDK
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      # 3. 拉取 RetroArch 源码
      - name: Clone RetroArch Frontend
        run: |
          git clone --depth=1 https://github.com/libretro/RetroArch.git retroarch-src

      # 4. 拉取模拟器内核源码
      - name: Clone Cores Source
        run: |
          mkdir -p cores-src
          git clone --depth=1 https://github.com/libretro/libretro-fceumm.git cores-src/fceumm
          git clone --depth=1 https://github.com/libretro/snes9x.git cores-src/snes9x
          git clone --depth=1 https://github.com/libretro/Genesis-Plus-GX.git cores-src/genesis
          git clone --depth=1 https://github.com/libretro/mgba.git cores-src/mgba

      # 5. 拉取全套资源文件
      - name: Clone RetroArch Assets
        run: |
          git clone --depth=1 https://github.com/libretro/retroarch-assets.git assets-src

      # 6. 编译 RetroArch Web 主程序
      - name: Build Web Frontend
        run: |
          source emsdk/emsdk_env.sh
          cd retroarch-src
          emmake make -f Makefile.emscripten HAVE_STATIC_DUMMY=1 -j$(nproc)

      # 7. 编译内核为 WASM 格式
      - name: Build Cores to WASM
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p dist/cores
          
          EMCC_FLAGS="-s WASM=1 -s FORCE_FILESYSTEM=1 -s EXIT_RUNTIME=0 -s EXPORTED_RUNTIME_METHODS=['FS','cwrap','ccall'] -O3"

          echo "=== 编译 FC (FCEUmm) ==="
          cd $GITHUB_WORKSPACE/cores-src/fceumm
          emmake make -f Makefile.libretro platform=emscripten -j$(nproc)
          emcc fceumm_libretro_emscripten.bc -o $GITHUB_WORKSPACE/dist/cores/fceumm_libretro_emscripten.js $EMCC_FLAGS

          echo "=== 编译 SFC (Snes9x) ==="
          cd $GITHUB_WORKSPACE/cores-src/snes9x/libretro
          emmake make platform=emscripten -j$(nproc)
          emcc snes9x_libretro_emscripten.bc -o $GITHUB_WORKSPACE/dist/cores/snes9x_libretro_emscripten.js $EMCC_FLAGS

          echo "=== 编译 MD (Genesis Plus GX) ==="
          cd $GITHUB_WORKSPACE/cores-src/genesis
          emmake make -f Makefile.libretro platform=emscripten -j$(nproc)
          emcc genesis_plus_gx_libretro_emscripten.bc -o $GITHUB_WORKSPACE/dist/cores/genesis_plus_gx_libretro_emscripten.js $EMCC_FLAGS

          echo "=== 编译 GBA (mGBA) ==="
          cd $GITHUB_WORKSPACE/cores-src/mgba
          emmake make -f Makefile.libretro platform=emscripten -j$(nproc)
          emcc mgba_libretro_emscripten.bc -o $GITHUB_WORKSPACE/dist/cores/mgba_libretro_emscripten.js $EMCC_FLAGS

      # 8. 整合打包文件
      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist/assets
          
          # 复制 web 壳文件
          cp retroarch-src/pkg/emscripten/libretro/index.html dist/
          cp retroarch-src/pkg/emscripten/libretro/libretro.css dist/
          cp retroarch-src/pkg/emscripten/libretro/libretro.js dist/
          cp retroarch-src/pkg/emscripten/libretro/browserfs.min.js dist/
          
          # 复制主程序 WASM & JS
          cp retroarch-src/retroarch.js dist/
          cp retroarch-src/retroarch.wasm dist/ 2>/dev/null || true
          
          # 复制 Assets 静态资源
          cp -r assets-src/* dist/assets/ 2>/dev/null || true

          # 生成适配当前核心的 core_list.js
          cat << 'EOF' > dist/core_list.js
          var CORE_LIST = [
            { name: "Nintendo - NES / FC (FCEUmm)", core_file: "cores/fceumm_libretro_emscripten.js" },
            { name: "Nintendo - SNES / SFC (Snes9x)", core_file: "cores/snes9x_libretro_emscripten.js" },
            { name: "Sega - Mega Drive / Genesis (Genesis Plus GX)", core_file: "cores/genesis_plus_gx_libretro_emscripten.js" },
            { name: "Nintendo - Game Boy Advance (mGBA)", core_file: "cores/mgba_libretro_emscripten.js" }
          ];
          EOF

      # 9. 压缩与上传
      - name: Compress Artifacts to tar.gz
        run: |
          tar -czvf retroarch-web-player.tar.gz -C dist .

      - name: Upload Streamlined Tarball
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-Web-Player-tarball
          path: retroarch-web-player.tar.gz
          if-no-files-found: error
