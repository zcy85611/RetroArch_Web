name: Build RetroArch Web Cores

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 配置 Python 与系统依赖
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. 安装并配置最新的 Emscripten SDK
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      # 3. 创建输出目录
      - name: Prepare Output Directory
        run: |
          mkdir -p dist/cores
          mkdir -p cores-src

      # 4. 克隆常见的 Libretro 内核源码
      - name: Clone Cores Source
        run: |
          cd cores-src
          git clone --depth 1 https://github.com/libretro/libretro-fceumm.git fceumm
          git clone --depth 1 https://github.com/libretro/Gambatte-libretro.git gambatte
          git clone --depth 1 https://github.com/libretro/snes9x.git snes9x
          git clone --depth 1 https://github.com/libretro/vbam-libretro.git vbam

      # 5. 编译内核并打包为 JS/WASM
      - name: Build Cores to WASM
        run: |
          # 统一的 Emscripten 封装 Flag
          EMCC_FLAGS="-s WASM=1 -s FORCE_FILESYSTEM=1 -s EXIT_RUNTIME=0 -s EXPORTED_RUNTIME_METHODS=['FS','cwrap','ccall'] -O3"

          # 通用编译打包函数
          build_core() {
            CORE_NAME=$1
            CORE_DIR=$2
            MAKEFILE_PATH=${3:-Makefile.libretro}
            
            echo "=========================================="
            echo "Building Core: ${CORE_NAME}"
            echo "=========================================="
            
            cd $GITHUB_WORKSPACE/cores-src/${CORE_DIR}
            
            # 清理旧编译结果
            emmake make -f ${MAKEFILE_PATH} platform=emscripten clean || true
            
            # 编译静态库
            emmake make -f ${MAKEFILE_PATH} platform=emscripten -j$(nproc)
            
            # 查找生成的 .bc 或 .a 库文件
            LIB_FILE=$(find . -maxdepth 2 -type f \( -name "*_emscripten.bc" -o -name "*_emscripten.a" \) | head -n 1)
            
            if [ -z "$LIB_FILE" ]; then
              echo "Error: Library file for ${CORE_NAME} not found!"
              exit 1
            fi
            
            # 将 .bc 重命名为 .a 避免 emcc/clang 误判文件格式
            REAL_LIB="${LIB_FILE%.*}.a"
            mv "$LIB_FILE" "$REAL_LIB"
            
            # 最终封装导出 JS + WASM
            emcc "$REAL_LIB" -o $GITHUB_WORKSPACE/dist/cores/${CORE_NAME}_libretro_emscripten.js $EMCC_FLAGS
            
            echo "Successfully built ${CORE_NAME}"
          }

          # 执行各个内核的编译
          build_core "fceumm" "fceumm"
          build_core "gambatte" "gambatte"
          build_core "snes9x" "snes9x" "libretro/Makefile"
          build_core "vbam" "vbam" "src/libretro/Makefile"

      # 6. 上传编译产物
      - name: Upload Cores Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Cores
          path: dist/cores/
