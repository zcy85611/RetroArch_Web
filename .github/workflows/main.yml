name: Build RetroArch Web Cores

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 配置 Python 与系统依赖
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. 安装并配置最新的 Emscripten SDK
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      # 3. 创建输出目录
      - name: Prepare Output Directory
        run: |
          mkdir -p dist/cores
          mkdir -p cores-src

      # 4. 克隆常见的 Libretro 内核源码
      - name: Clone Cores Source
        run: |
          cd cores-src
          git clone --depth 1 https://github.com/libretro/libretro-fceumm.git fceumm
          git clone --depth 1 https://github.com/libretro/Gambatte-libretro.git gambatte
          git clone --depth 1 https://github.com/libretro/snes9x.git snes9x
          git clone --depth 1 https://github.com/libretro/vbam-libretro.git vbam

# 5. 编译内核并打包为 JS/WASM
      - name: Build Cores to WASM
        run: |
          EMCC_FLAGS="-s WASM=1 -s FORCE_FILESYSTEM=1 -s EXIT_RUNTIME=0 -s EXPORTED_RUNTIME_METHODS=['FS','cwrap','ccall'] -O3"

          # 1. 编译 FC (fceumm)
          echo "================ Building FCEUmm ================"
          cd $GITHUB_WORKSPACE/cores-src/fceumm
          emmake make -f Makefile.libretro platform=emscripten -j$(nproc)
          mv fceumm_libretro_emscripten.bc fceumm_libretro_emscripten.a
          emcc fceumm_libretro_emscripten.a -o $GITHUB_WORKSPACE/dist/cores/fceumm_libretro_emscripten.js $EMCC_FLAGS

          # 2. 编译 GB/GBC (gambatte)
          echo "================ Building Gambatte ================"
          cd $GITHUB_WORKSPACE/cores-src/gambatte
          emmake make -f Makefile.libretro platform=emscripten -j$(nproc)
          mv gambatte_libretro_emscripten.bc gambatte_libretro_emscripten.a
          emcc gambatte_libretro_emscripten.a -o $GITHUB_WORKSPACE/dist/cores/gambatte_libretro_emscripten.js $EMCC_FLAGS

          # 3. 编译 SFC (snes9x) -> 注意需要 cd 进入 libretro 目录
          echo "================ Building Snes9x ================"
          cd $GITHUB_WORKSPACE/cores-src/snes9x/libretro
          emmake make -f Makefile platform=emscripten -j$(nproc)
          mv snes9x_libretro_emscripten.bc snes9x_libretro_emscripten.a
          emcc snes9x_libretro_emscripten.a -o $GITHUB_WORKSPACE/dist/cores/snes9x_libretro_emscripten.js $EMCC_FLAGS

          # 4. 编译 GBA (vbam)
          echo "================ Building VBA-M ================"
          cd $GITHUB_WORKSPACE/cores-src/vbam/src/libretro
          emmake make -f Makefile platform=emscripten -j$(nproc)
          mv vbam_libretro_emscripten.bc vbam_libretro_emscripten.a
          emcc vbam_libretro_emscripten.a -o $GITHUB_WORKSPACE/dist/cores/vbam_libretro_emscripten.js $EMCC_FLAGS

      # 6. 上传编译产物
      - name: Upload Cores Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Cores
          path: dist/cores/
